version: "2"

run:
  timeout: 5m
  build-tags: [integration]

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - revive
    - unconvert
  settings:
    gosec:
      excludes:
        - G115 # integer conversions: values are range-checked by config/validation
    revive:
      rules:
        - name: exported
          disabled: true
  exclusions:
    presets: [std-error-handling]
    rules:
      - path: _test\.go
        linters: [gosec, errcheck, bodyclose]
      - path: tests/
        linters: [gosec]

formatters:
  enable: [gofmt]
