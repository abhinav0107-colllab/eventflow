global:
  scrape_interval: 5s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: eventflow-api
    static_configs:
      - targets: ["api:8080"]

  # Every worker replica is discovered through Docker's embedded DNS.
  - job_name: eventflow-worker
    dns_sd_configs:
      - names: ["worker"]
        type: A
        port: 9091
        refresh_interval: 15s

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
