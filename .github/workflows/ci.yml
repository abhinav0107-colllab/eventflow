name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26.11"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: gofmt
        run: make fmt-check
      - name: go vet
        run: make vet
      - name: go mod tidy is clean
        run: go mod tidy && git diff --exit-code go.mod go.sum
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go test -race -count=1 -coverprofile=unit.out ./...
      - run: go tool cover -func=unit.out | tail -1

  integration:
    name: Integration & failure tests (Testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Run integration suite against real PostgreSQL and Redis
        run: go test -tags integration -race -count=1 -timeout 20m -v ./tests/integration/... 2>&1 | tee integration.log
      - name: Summary
        if: always()
        run: grep -E '^(--- |ok|FAIL)' integration.log || true

  compose-smoke:
    name: Docker build + Compose smoke test
    runs-on: ubuntu-latest
    needs: [unit]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Generate throwaway secrets
        run: make env
      - name: Build and start the stack
        run: docker compose up -d --build --wait --wait-timeout 180 postgres redis api worker
      - name: Smoke test
        run: make smoke
      - name: Verify metrics endpoint
        run: curl -fsS http://localhost:8080/metrics | grep -q eventflow_jobs_submitted_total
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v
