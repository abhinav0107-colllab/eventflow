# EventFlow local stack.
#
#   cp .env.example .env   # then replace every placeholder (or: make env)
#   docker compose up -d --build
#
# Services: PostgreSQL, Redis, a one-shot migration job, the API (with the
# outbox relay), two worker replicas, Prometheus and Grafana.

name: eventflow

x-hardening: &hardening
  read_only: true
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  restart: unless-stopped

x-app-env: &app-env
  EVENTFLOW_DATABASE_URL: postgres://eventflow_app:${EVENTFLOW_APP_DB_PASSWORD:?set in .env}@postgres:5432/eventflow?sslmode=disable
  EVENTFLOW_REDIS_ADDR: redis:6379
  EVENTFLOW_REDIS_PASSWORD: ${REDIS_PASSWORD:?set in .env}
  EVENTFLOW_LOG_LEVEL: ${EVENTFLOW_LOG_LEVEL:-info}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: eventflow
      POSTGRES_USER: eventflow_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      EVENTFLOW_APP_DB_PASSWORD: ${EVENTFLOW_APP_DB_PASSWORD:?set in .env}
    command: ["postgres", "-c", "max_connections=200", "-c", "shared_buffers=256MB"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/init-roles.sh:/docker-entrypoint-initdb.d/10-init-roles.sh:ro
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventflow_owner -d eventflow"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.2-alpine
    # AOF persistence so stream entries and consumer-group state survive a
    # restart; the recovery manager still repairs any lost messages.
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--requirepass", "${REDIS_PASSWORD:?set in .env}"]
    volumes: [redisdata:/data]
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    restart: unless-stopped

  migrate:
    build: {context: ., dockerfile: deploy/docker/Dockerfile, target: migrate}
    image: eventflow-migrate:local
    environment:
      EVENTFLOW_DATABASE_URL: postgres://eventflow_owner:${POSTGRES_PASSWORD}@postgres:5432/eventflow?sslmode=disable
    command: ["up"]
    depends_on:
      postgres: {condition: service_healthy}
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    restart: "no"

  api:
    <<: *hardening
    build: {context: ., dockerfile: deploy/docker/Dockerfile, target: api}
    image: eventflow-api:local
    environment:
      <<: *app-env
      EVENTFLOW_API_KEYS: ${EVENTFLOW_API_KEYS:?set in .env}
      EVENTFLOW_HTTP_ADDR: ":8080"
      EVENTFLOW_DB_MAX_CONNS: "40"
    ports: ["8080:8080"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}

  worker:
    <<: *hardening
    build: {context: ., dockerfile: deploy/docker/Dockerfile, target: worker}
    image: eventflow-worker:local
    environment:
      <<: *app-env
      EVENTFLOW_WORKER_CONCURRENCY: ${EVENTFLOW_WORKER_CONCURRENCY:-16}
      EVENTFLOW_WORKER_METRICS_ADDR: ":9091"
      EVENTFLOW_DB_MAX_CONNS: "30"
    deploy:
      replicas: ${EVENTFLOW_WORKER_REPLICAS:-2}
    stop_grace_period: 40s
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}

  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - promdata:/prometheus
    ports: ["127.0.0.1:9090:9090"]
    depends_on: [api, worker]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.2
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/eventflow.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [prometheus]
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  promdata:
  grafanadata:
